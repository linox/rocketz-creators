# Deploy produção: creatorz.digital (front estático) + api.creatorz.digital (Laravel).
#
# FTP (contas criadas em cPanel → Contas de FTP, não o usuário principal do painel):
#   web → Host creatorz.digital
#         Diretório no cPanel: /home/creatorz/public_html
#   api → Host api.creatorz.digital
#         Diretório no cPanel: /home/apicreatorzdig/public_html
# O FTP já abre em public_html, então o remote dir padrão é /.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   CPANEL_WEB_FTP_PASSWORD   senha da conta FTP do front
#   CPANEL_API_FTP_PASSWORD   senha da conta FTP da API
#   CPANEL_WEB_REMOTE_DIR     opcional; padrão /
#   CPANEL_API_REMOTE_DIR     opcional; padrão /
#
# Variables (Settings → Secrets and variables → Actions → Variables):
#   CPANEL_WEB_FTP_USER       padrão deploy@creatorz.digital
#   CPANEL_API_FTP_USER       padrão deploy@api.creatorz.digital
#
# Cada push na main incrementa o patch em rocktz-web/package.json, faz commit
# e publica web + API com o mesmo número. O GITHUB_TOKEN não dispara outro workflow.
#
# O .env da API não é enviado.
# vendor/ e vendor.zip NÃO sobem no git nem no FTP do Action — só publicação manual no servidor.
# A versão da tela/health é a de rocktz-web/package.json (arquivo APP_VERSION gerado no job api).
# Não apague .ftp-deploy-sync-state.json no servidor.
# Depois do FTP o job reenvia PHP crítico, apaga só cache de rotas/config e chama
# opcache_reset() — no LiteSpeed o opcode cache ignora arquivo novo no disco.

name: Deploy cPanel

on:
  push:
    branches: [main]
    paths:
      - "rocktz-web/**"
      - "scripts/**"
      - "rocktz-api/**"
      - ".github/workflows/deploy-cpanel.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cpanel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    name: Incrementar versão
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Patch (package.json)
        working-directory: rocktz-web
        run: npm version patch --no-git-tag-version

      - id: ver
        run: echo "version=$(node -p "require('./rocktz-web/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rocktz-web/package.json rocktz-web/package-lock.json
          git commit -m "chore: versão ${{ steps.ver.outputs.version }}"
          git pull --rebase origin main
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  web:
    name: Front (creatorz.digital)
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rocktz-web/package-lock.json

      - name: Build estático cPanel
        run: ./scripts/build-web.sh --no-bump --api https://api.creatorz.digital/api --app https://creatorz.digital

      - name: Conferir dist-cpanel
        run: |
          test -f rocktz-web/dist-cpanel/index.html
          test -f rocktz-web/dist-cpanel/.htaccess

      - name: Diretório remoto (web)
        id: remote
        env:
          RAW: ${{ secrets.CPANEL_WEB_REMOTE_DIR }}
        run: |
          d="${RAW:-/}"
          case "$d" in */) ;; *) d="${d}/" ;; esac
          echo "server_dir=$d" >> "$GITHUB_OUTPUT"

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: creatorz.digital
          username: ${{ vars.CPANEL_WEB_FTP_USER || 'deploy@creatorz.digital' }}
          password: ${{ secrets.CPANEL_WEB_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          local-dir: ./rocktz-web/dist-cpanel/
          server-dir: ${{ steps.remote.outputs.server_dir }}
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.well-known/**
            **/cgi-bin/**

  api:
    name: API (api.creatorz.digital)
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer

      - name: Composer (produção)
        working-directory: rocktz-api
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
          test -f vendor/autoload.php
          cp .env.example .env
          php -r '$f=".env"; $k="base64:".base64_encode(random_bytes(32)); file_put_contents($f, preg_replace("/^APP_KEY=.*/m", "APP_KEY=".$k, file_get_contents($f)));'
          php artisan package:discover --ansi --no-interaction
          test -f bootstrap/cache/packages.php
          test -f bootstrap/cache/services.php
          rm -f .env

      - name: Versão (mesma do rocktz-web)
        run: |
          ver="$(node -p "require('./rocktz-web/package.json').version")"
          printf '%s\n' "$ver" > rocktz-api/APP_VERSION
          printf '%s\n' "$ver" > rocktz-api/public/DEPLOY_VERSION.txt

      - name: Diretório remoto (API)
        id: remote
        env:
          RAW: ${{ secrets.CPANEL_API_REMOTE_DIR }}
        run: |
          d="${RAW:-/}"
          case "$d" in */) ;; *) d="${d}/" ;; esac
          echo "server_dir=$d" >> "$GITHUB_OUTPUT"

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: api.creatorz.digital
          username: ${{ vars.CPANEL_API_FTP_USER || 'deploy@api.creatorz.digital' }}
          password: ${{ secrets.CPANEL_API_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          log-level: standard
          local-dir: ./rocktz-api/
          server-dir: ${{ steps.remote.outputs.server_dir }}
          timeout: 1200000
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            **/vendor/**
            **/vendor.zip
            **/node_modules/**
            **/tests/**
            **/.phpunit.cache/**
            **/phpunit.xml
            **/phpunit.xml.dist
            **/storage/logs/*.log
            **/public/uploads/**
            **/public/hot
            **/public/storage
            **/public/build/**
            **/bootstrap/cache/config.php
            **/bootstrap/cache/routes*.php
            **/bootstrap/cache/events.php

      - name: Reenviar PHP crítico, limpar cache e quebrar opcode
        env:
          FTP_USER: ${{ vars.CPANEL_API_FTP_USER || 'deploy@api.creatorz.digital' }}
          FTP_PASS: ${{ secrets.CPANEL_API_FTP_PASSWORD }}
          SERVER_DIR: ${{ steps.remote.outputs.server_dir }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          token="$(openssl rand -hex 16)"
          reset_name="deploy-opcache-${token}.php"
          cleanup() {
            lftp -c "
              set ssl:verify-certificate no;
              set ftp:passive-mode true;
              open -u ${FTP_USER},${FTP_PASS} ftp://api.creatorz.digital;
              cd ${SERVER_DIR};
              rm -f public/${reset_name};
            " >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            open -u ${FTP_USER},${FTP_PASS} ftp://api.creatorz.digital;
            cd ${SERVER_DIR};
            put -O app/Http/Controllers/Api rocktz-api/app/Http/Controllers/Api/HealthController.php;
            put -O app/Http/Controllers/Api rocktz-api/app/Http/Controllers/Api/CreatorStorefrontController.php;
            put -O app/Support rocktz-api/app/Support/AppVersion.php;
            put -O routes rocktz-api/routes/api.php;
            put rocktz-api/APP_VERSION -o APP_VERSION;
            put -O public rocktz-api/public/DEPLOY_VERSION.txt;
            put -O bootstrap/cache rocktz-api/bootstrap/cache/packages.php;
            put -O bootstrap/cache rocktz-api/bootstrap/cache/services.php;
            put scripts/cpanel-opcache-reset.php -o public/${reset_name};
            rm -f bootstrap/cache/config.php;
            rm -f bootstrap/cache/events.php;
            rm -f bootstrap/cache/routes.php;
            rm -f bootstrap/cache/routes-v7.php;
          "
          list="$(lftp -c "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            open -u ${FTP_USER},${FTP_PASS} ftp://api.creatorz.digital;
            cd ${SERVER_DIR};
            cls -1 app/Http/Controllers/Api;
          ")"
          echo "$list"
          echo "$list" | grep -q CreatorStorefrontController.php || {
            echo "CreatorStorefrontController.php não está na raiz Laravel do FTP." >&2
            echo "No cPanel, a conta FTP da API (${FTP_USER}) deve ter Diretório = /home/apicreatorzdig/public_html (não .../public_html/public)." >&2
            exit 1
          }
          reset_json="$(curl -fsS -H 'Cache-Control: no-cache' "https://api.creatorz.digital/${reset_name}")"
          echo "$reset_json"
          echo "$reset_json" | grep -q '"vendor_autoload":true' || {
            echo "vendor/autoload.php não está no servidor. Envie vendor/ no FTP à mão; o Action não publica vendor." >&2
            exit 1
          }
          echo "$reset_json" | grep -q '"env":true' || {
            echo ".env ausente no servidor. Restaure pelo cPanel (File Manager); o deploy nunca envia .env." >&2
            exit 1
          }
          echo "$reset_json" | grep -q '"health_on_disk":true' || {
            echo "HealthController.php no disco ainda não tem AppVersion — o FTP não gravou app/." >&2
            exit 1
          }
          echo "$reset_json" | grep -q '"storefront_routes":true' || {
            echo "routes/api.php no disco ainda não tem storefront/settings." >&2
            exit 1
          }

      - name: Conferir API no ar
        run: |
          sleep 3
          health="$(curl -fsS -H 'Accept: application/json' -H 'Cache-Control: no-cache' "https://api.creatorz.digital/api/health?t=$(date +%s)")"
          echo "$health"
          echo "$health" | grep -q '"version"' || {
            echo "O /api/health ainda é o PHP antigo (sem version) depois de opcache_reset. Reinicie o PHP no cPanel (Select PHP Version → Reset, ou LiteSpeed → Graceful Restart)." >&2
            exit 1
          }
          code="$(curl -sS -o /tmp/sf.json -w '%{http_code}' -H 'Accept: application/json' -H 'Cache-Control: no-cache' https://api.creatorz.digital/api/creators/5/storefront)"
          cat /tmp/sf.json
          if [ "$code" = "404" ]; then
            echo "Storefront ainda 404 depois do deploy." >&2
            exit 1
          fi

