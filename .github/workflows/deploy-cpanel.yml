# Deploy produção: creatorz.digital (front estático) + api.creatorz.digital (Laravel).
#
# FTP (contas criadas em cPanel → Contas de FTP, não o usuário principal do painel):
#   web → Host creatorz.digital, user gitaction@creatorz.digital
#         Diretório no cPanel: /home/creatorz/public_html
#   api → Host api.creatorz.digital, user gitaction@api.creatorz.digital
#         Diretório no cPanel: /home/apicreatorzdig/public_html
# O FTP já abre em public_html, então o remote dir padrão é /.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CPANEL_FTP_PASSWORD     senha FTP (a mesma nas duas contas)
#   CPANEL_WEB_REMOTE_DIR   opcional; padrão / (conta já restrita a public_html)
#   CPANEL_API_REMOTE_DIR   opcional; padrão /
#
# Cada push na main incrementa o patch em rocktz-web/package.json, faz commit
# e publica web + API com o mesmo número. O GITHUB_TOKEN não dispara outro workflow.
#
# O .env da API não é enviado.
# A versão da tela/health é a de rocktz-web/package.json (arquivo APP_VERSION gerado no job api).
# Depois do FTP o job reenvia HealthController/routes, apaga bootstrap/cache e chama
# opcache_reset() — no LiteSpeed o opcode cache ignora arquivo novo no disco.
# O vendor da API também não: instale localmente e envie por FTP quando composer.lock mudar.
# Antes do primeiro deploy com esse exclude, apague no cPanel da API
# (.ftp-deploy-sync-state.json na raiz do FTP). Sem isso, o sync apaga o vendor já publicado.

name: Deploy cPanel

on:
  push:
    branches: [main]
    paths:
      - "rocktz-web/**"
      - "scripts/**"
      - "rocktz-api/**"
      - ".github/workflows/deploy-cpanel.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cpanel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    name: Incrementar versão
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Patch (package.json)
        working-directory: rocktz-web
        run: npm version patch --no-git-tag-version

      - id: ver
        run: echo "version=$(node -p "require('./rocktz-web/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rocktz-web/package.json rocktz-web/package-lock.json
          git commit -m "chore: versão ${{ steps.ver.outputs.version }}"
          git pull --rebase origin main
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  web:
    name: Front (creatorz.digital)
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rocktz-web/package-lock.json

      - name: Build estático cPanel
        run: ./scripts/build-web.sh --no-bump --api https://api.creatorz.digital/api --app https://creatorz.digital

      - name: Conferir dist-cpanel
        run: |
          test -f rocktz-web/dist-cpanel/index.html
          test -f rocktz-web/dist-cpanel/.htaccess

      - name: Diretório remoto (web)
        id: remote
        env:
          RAW: ${{ secrets.CPANEL_WEB_REMOTE_DIR }}
        run: |
          d="${RAW:-/}"
          case "$d" in */) ;; *) d="${d}/" ;; esac
          echo "server_dir=$d" >> "$GITHUB_OUTPUT"

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: creatorz.digital
          username: gitaction@creatorz.digital
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          local-dir: ./rocktz-web/dist-cpanel/
          server-dir: ${{ steps.remote.outputs.server_dir }}
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.well-known/**
            **/cgi-bin/**

  api:
    name: API (api.creatorz.digital)
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Versão (mesma do rocktz-web)
        run: |
          ver="$(node -p "require('./rocktz-web/package.json').version")"
          printf '%s\n' "$ver" > rocktz-api/APP_VERSION
          printf '%s\n' "$ver" > rocktz-api/public/DEPLOY_VERSION.txt

      - name: Diretório remoto (API)
        id: remote
        env:
          RAW: ${{ secrets.CPANEL_API_REMOTE_DIR }}
        run: |
          d="${RAW:-/}"
          case "$d" in */) ;; *) d="${d}/" ;; esac
          echo "server_dir=$d" >> "$GITHUB_OUTPUT"

      - name: Forçar reenvio (apaga sync state do FTP)
        env:
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          SERVER_DIR: ${{ steps.remote.outputs.server_dir }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            open -u gitaction@api.creatorz.digital,${FTP_PASS} ftp://api.creatorz.digital;
            cd ${SERVER_DIR};
            rm -f .ftp-deploy-sync-state.json;
            pwd;
            cls -1;
          "

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: api.creatorz.digital
          username: gitaction@api.creatorz.digital
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          log-level: verbose
          local-dir: ./rocktz-api/
          server-dir: ${{ steps.remote.outputs.server_dir }}
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            **/vendor/**
            **/node_modules/**
            **/tests/**
            **/.phpunit.cache/**
            **/phpunit.xml
            **/phpunit.xml.dist
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/public/uploads/**
            **/public/hot
            **/public/storage
            **/public/build/**
            **/bootstrap/cache/*.php

      - name: Reenviar PHP crítico, limpar cache e quebrar opcode
        env:
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          SERVER_DIR: ${{ steps.remote.outputs.server_dir }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 16)"
          reset_name="deploy-opcache-${token}.php"
          cleanup() {
            lftp -c "
              set ssl:verify-certificate no;
              set ftp:passive-mode true;
              open -u gitaction@api.creatorz.digital,${FTP_PASS} ftp://api.creatorz.digital;
              cd ${SERVER_DIR};
              rm -f public/${reset_name};
            " >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            open -u gitaction@api.creatorz.digital,${FTP_PASS} ftp://api.creatorz.digital;
            cd ${SERVER_DIR};
            put -O app/Http/Controllers/Api rocktz-api/app/Http/Controllers/Api/HealthController.php;
            put -O app/Http/Controllers/Api rocktz-api/app/Http/Controllers/Api/CreatorStorefrontController.php;
            put -O app/Support rocktz-api/app/Support/AppVersion.php;
            put -O routes rocktz-api/routes/api.php;
            put rocktz-api/APP_VERSION -o APP_VERSION;
            put -O public rocktz-api/public/DEPLOY_VERSION.txt;
            put scripts/cpanel-opcache-reset.php -o public/${reset_name};
            cd bootstrap/cache && glob -a rm -f *.php;
          "
          list="$(lftp -c "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            open -u gitaction@api.creatorz.digital,${FTP_PASS} ftp://api.creatorz.digital;
            cd ${SERVER_DIR};
            cls -1 app/Http/Controllers/Api;
          ")"
          echo "$list"
          echo "$list" | grep -q CreatorStorefrontController.php || {
            echo "CreatorStorefrontController.php não está na raiz Laravel do FTP." >&2
            echo "No cPanel, a conta gitaction@api.creatorz.digital deve ter Diretório = /home/apicreatorzdig/public_html (não .../public_html/public)." >&2
            exit 1
          }
          reset_json="$(curl -fsS -H 'Cache-Control: no-cache' "https://api.creatorz.digital/${reset_name}")"
          echo "$reset_json"
          echo "$reset_json" | grep -q '"health_on_disk":true' || {
            echo "HealthController.php no disco ainda não tem AppVersion — o FTP não gravou app/." >&2
            exit 1
          }
          echo "$reset_json" | grep -q '"storefront_routes":true' || {
            echo "routes/api.php no disco ainda não tem storefront/settings." >&2
            exit 1
          }

      - name: Conferir API no ar
        run: |
          sleep 3
          health="$(curl -fsS -H 'Accept: application/json' -H 'Cache-Control: no-cache' "https://api.creatorz.digital/api/health?t=$(date +%s)")"
          echo "$health"
          echo "$health" | grep -q '"version"' || {
            echo "O /api/health ainda é o PHP antigo (sem version) depois de opcache_reset. Reinicie o PHP no cPanel (Select PHP Version → Reset, ou LiteSpeed → Graceful Restart)." >&2
            exit 1
          }
          code="$(curl -sS -o /tmp/sf.json -w '%{http_code}' -H 'Accept: application/json' -H 'Cache-Control: no-cache' https://api.creatorz.digital/api/creators/5/storefront)"
          cat /tmp/sf.json
          if [ "$code" = "404" ]; then
            echo "Storefront ainda 404 depois do deploy." >&2
            exit 1
          fi

