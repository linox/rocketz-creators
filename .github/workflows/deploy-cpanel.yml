# Deploy produção: creatorz.digital (front estático) + api.creatorz.digital (Laravel).
#
# FTP (contas criadas em cPanel → Contas de FTP, não o usuário principal do painel):
#   web → Host creatorz.digital, user gitaction@creatorz.digital
#         Diretório no cPanel: /home/creatorz/public_html
#   api → Host api.creatorz.digital, user gitaction@api.creatorz.digital
#         Diretório no cPanel: /home/apicreatorzdig/public_html
# O FTP já abre em public_html, então o remote dir padrão é /.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CPANEL_FTP_PASSWORD     senha FTP (a mesma nas duas contas)
#   CPANEL_WEB_REMOTE_DIR   opcional; padrão / (conta já restrita a public_html)
#   CPANEL_API_REMOTE_DIR   opcional; padrão /
#
# Cada push na main incrementa o patch em rocktz-web/package.json, faz commit
# e publica web + API com o mesmo número. O GITHUB_TOKEN não dispara outro workflow.
#
# O .env da API não é enviado.
# A versão da tela/health é a de rocktz-web/package.json (arquivo APP_VERSION gerado no job api).
# O vendor da API também não: instale localmente e envie por FTP quando composer.lock mudar.
# Antes do primeiro deploy com esse exclude, apague no cPanel da API
# (.ftp-deploy-sync-state.json na raiz do FTP). Sem isso, o sync apaga o vendor já publicado.

name: Deploy cPanel

on:
  push:
    branches: [main]
    paths:
      - "rocktz-web/**"
      - "scripts/**"
      - "rocktz-api/**"
      - ".github/workflows/deploy-cpanel.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cpanel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    name: Incrementar versão
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Patch (package.json)
        working-directory: rocktz-web
        run: npm version patch --no-git-tag-version

      - id: ver
        run: echo "version=$(node -p "require('./rocktz-web/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rocktz-web/package.json rocktz-web/package-lock.json
          git commit -m "chore: versão ${{ steps.ver.outputs.version }}"
          git pull --rebase origin main
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  web:
    name: Front (creatorz.digital)
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rocktz-web/package-lock.json

      - name: Build estático cPanel
        run: ./scripts/build-web.sh --no-bump --api https://api.creatorz.digital/api --app https://creatorz.digital

      - name: Conferir dist-cpanel
        run: |
          test -f rocktz-web/dist-cpanel/index.html
          test -f rocktz-web/dist-cpanel/.htaccess

      - name: Diretório remoto (web)
        id: remote
        env:
          RAW: ${{ secrets.CPANEL_WEB_REMOTE_DIR }}
        run: |
          d="${RAW:-/}"
          case "$d" in */) ;; *) d="${d}/" ;; esac
          echo "server_dir=$d" >> "$GITHUB_OUTPUT"

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: creatorz.digital
          username: gitaction@creatorz.digital
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          local-dir: ./rocktz-web/dist-cpanel/
          server-dir: ${{ steps.remote.outputs.server_dir }}
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.well-known/**
            **/cgi-bin/**

  api:
    name: API (api.creatorz.digital)
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Versão (mesma do rocktz-web)
        run: printf '%s\n' "$(node -p "require('./rocktz-web/package.json').version")" > rocktz-api/APP_VERSION

      - name: Diretório remoto (API)
        id: remote
        env:
          RAW: ${{ secrets.CPANEL_API_REMOTE_DIR }}
        run: |
          d="${RAW:-/}"
          case "$d" in */) ;; *) d="${d}/" ;; esac
          echo "server_dir=$d" >> "$GITHUB_OUTPUT"

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: api.creatorz.digital
          username: gitaction@api.creatorz.digital
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          local-dir: ./rocktz-api/
          server-dir: ${{ steps.remote.outputs.server_dir }}
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            **/vendor/**
            **/node_modules/**
            **/tests/**
            **/.phpunit.cache/**
            **/phpunit.xml
            **/phpunit.xml.dist
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/public/uploads/**
            **/public/hot
            **/public/storage
            **/public/build/**
            **/bootstrap/cache/*.php

      - name: Limpar cache de rotas (senão rotas novas 404)
        env:
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          SERVER_DIR: ${{ steps.remote.outputs.server_dir }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            open -u gitaction@api.creatorz.digital,${FTP_PASS} ftp://api.creatorz.digital;
            cd ${SERVER_DIR};
            glob -a rm -f bootstrap/cache/routes*.php;
            glob -a rm -f bootstrap/cache/config.php;
            glob -a rm -f bootstrap/cache/events.php;
          "
